identity:
  name: aliyun_dns
  author: showniu
  label:
    en_US: Aliyun DNS
    zh_Hans: 阿里云 DNS
  description:
    en_US: Aliyun DNS service provider for managing domain DNS records via Alibaba Cloud DNS API.
    zh_Hans: 通过阿里云 DNS API 管理域名解析记录的服务提供商。
  icon: icon.svg
credentials_for_provider:
  access_key_id:
    type: text-input
    required: true
    label:
      en_US: AccessKey ID
      zh_Hans: AccessKey ID
    placeholder:
      en_US: Enter your Alibaba Cloud AccessKey ID
      zh_Hans: 请输入阿里云 AccessKey ID
    help:
      en_US: Your Alibaba Cloud AccessKey ID. Recommended to use a RAM sub-account with AliyunDNSFullAccess policy.
      zh_Hans: 阿里云 AccessKey ID。建议使用授予了 AliyunDNSFullAccess 权限的 RAM 子账号。
    url: https://ram.console.aliyun.com/manage/ak
  access_key_secret:
    type: secret-input
    required: true
    label:
      en_US: AccessKey Secret
      zh_Hans: AccessKey Secret
    placeholder:
      en_US: Enter your Alibaba Cloud AccessKey Secret
      zh_Hans: 请输入阿里云 AccessKey Secret
    help:
      en_US: Your Alibaba Cloud AccessKey Secret corresponding to the AccessKey ID above.
      zh_Hans: 与上方 AccessKey ID 对应的阿里云 AccessKey Secret。
    url: https://ram.console.aliyun.com/manage/ak
extra:
  python:
    source: provider/aliyun_dns.py
tools:
  - tools/list_records.yaml
  - tools/add_record.yaml
  - tools/update_record.yaml
  - tools/delete_record.yaml
  - tools/set_record_status.yaml
